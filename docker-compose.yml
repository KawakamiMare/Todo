services:
  db:
    image: postgres:15
    container_name: todo_db
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: 
      - "5432:5432"
      # "ホスト側:コンテナ側" Springbootはホスト側に接続し、PostgreSQLはコンテナ側で待ち受ける。
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: